<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vmGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="vmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#vmGreen)" />

  <g filter="url(#dropShadow)" transform="translate(0, -10)">
    <!-- Roof / Dukan Top -->
    <path d="M256 100 L110 215 H402 Z" fill="url(#vmGold)" />
    
    <!-- White Shopping Bag Base -->
    <rect x="145" y="215" width="222" height="175" rx="24" fill="#ffffff" />

    <!-- Bag Handle -->
    <path d="M210 215 V175 C210 150 302 150 302 175 V215" fill="none" stroke="#047857" stroke-width="14" stroke-linecap="round" />

    <!-- Big Bold 'V' inside the Bag -->
    <path d="M215 250 L256 345 L297 250" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Rupee Badge -->
    <circle cx="340" cy="360" r="28" fill="url(#vmGold)" />
    <text x="340" y="371" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
  </g>

  <!-- Brand Name: VIKASH MART -->
  <text x="256" y="452" font-family="'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    VIKASH<tspan fill="#fcd34d"> MART</tspan>
  </text>
</svg>
