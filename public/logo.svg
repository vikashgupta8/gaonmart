  <!-- Modern 'V' Grocery Shape -->
  <path d="M35,40 L65,95 L95,40" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Delivery Speed Dot -->
